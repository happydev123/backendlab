name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test
      - name: Race detector
        run: make race
      - name: Build
        run: make build
