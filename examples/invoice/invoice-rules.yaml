# ExtractCheck rules for invoices extracted into JSON.
# Used with invoices-batch.json and invoice.schema.json; see docs/validation.md.
version: 1
schema: invoice.schema.json
document_id: /invoice_number
rules:
  - id: required-fields
    type: required
    fields:
      - /invoice_number
      - /issue_date
      - /currency
      - /total
      - /line_items/*/quantity
      - /line_items/*/unit_price
      - /line_items/*/amount

  - id: invoice-number-format
    type: pattern
    field: /invoice_number
    pattern: '^INV-([0-9]{4}-)?[0-9]{4}$'

  - id: currency-code
    type: allowed_values
    field: /currency
    values: [EUR, GBP, USD]

  - id: money-format
    type: decimal
    description: Money values are non-negative with at most two decimal places.
    fields:
      - /subtotal
      - /tax
      - /discount
      - /total
      - /line_items/*/unit_price
      - /line_items/*/amount
    accept: [number, string]
    max_scale: 2
    min: "0"

  - id: tax-rate-format
    type: decimal
    fields: [/tax_rate]
    max_scale: 4
    min: "0"
    max: "1"

  - id: line-amounts
    type: line_item_product
    items: /line_items
    quantity: quantity
    unit_price: unit_price
    amount: amount
    round: {scale: 2, mode: half_up}

  - id: subtotal-from-lines
    type: line_items_sum
    items: /line_items
    amount: amount
    equals: /subtotal

  - id: tax-from-rate
    type: product
    factors: [/subtotal, /tax_rate]
    equals: /tax
    round: {scale: 2, mode: half_even}

  - id: total
    type: sum
    terms:
      - field: /subtotal
      - field: /tax
      - field: /discount
        sign: -1
        optional: true
    equals: /total
    tolerance: "0.01"

  - id: dates
    type: date
    fields: [/issue_date, /due_date]
    layout: date

  - id: due-after-issue
    type: date_order
    before: /issue_date
    after: /due_date
    allow_equal: true

  - id: unique-invoice-number
    type: unique
    field: /invoice_number
